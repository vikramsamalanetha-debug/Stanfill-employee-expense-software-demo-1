<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Invoice</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<!-- A client's view of one invoice, opened from the link the business sent.
     DayZift never takes payments: "Pay online" goes to the business's own payment page.
     A product of LIT America (www.litamerica.net). -->
<style>
:root{--bg:#EEF1F5;--ink:#16202E;--muted:#5E6878;--line:#E4E7EC}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 "Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:860px;margin:0 auto;padding:28px 16px 48px}
.bar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:16px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.due{font-weight:600}
.due b{font-size:20px;font-weight:800}
.btn{border:1px solid var(--line);background:#fff;padding:10px 18px;border-radius:8px;font:700 14px "Inter","Segoe UI",sans-serif;cursor:pointer;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.btn.pay{background:var(--ac,#1E3A5F);border-color:var(--ac,#1E3A5F);color:#fff}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.msg{background:#fff;border:1px solid var(--line);border-radius:10px;padding:28px;text-align:center}
.help{color:var(--muted);font-size:12.5px;text-align:center;margin:16px 0 0}
@media print{ body{background:#fff} .bar,.noprint{display:none!important} .wrap{padding:0;max-width:none} }
.ivd{--ac:#1E3A5F;--ink:#16202E;--mut:#5E6878;--ln:#E4E7EC;--soft:#F5F7FA;position:relative;background:#fff;color:var(--ink);font:400 13.5px/1.5 "Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;border:1px solid var(--ln);border-radius:10px;overflow:hidden;max-width:820px;margin:0 auto;-webkit-print-color-adjust:exact;print-color-adjust:exact;font-variant-numeric:tabular-nums}
.ivd *{box-sizing:border-box}
.ivd .iv-band{height:8px;background:var(--ac)}
.ivd .iv-in{padding:36px 40px 28px}
.ivd .iv-head{display:flex;justify-content:space-between;align-items:flex-start;gap:24px}
.ivd .iv-from{display:flex;gap:14px;align-items:flex-start;min-width:0}
.ivd .iv-logo{max-width:150px;max-height:64px;object-fit:contain;display:block}
.ivd .iv-mono{width:52px;height:52px;border-radius:10px;background:var(--ac);color:#fff;display:grid;place-items:center;font:800 20px/1 "Inter","Segoe UI",sans-serif;letter-spacing:.02em;flex:none}
.ivd .iv-biz{font:750 19px/1.25 "Inter","Segoe UI",sans-serif;letter-spacing:-.01em}
.ivd .iv-addr{color:var(--mut);font-size:12.5px;margin-top:3px;line-height:1.55;overflow-wrap:anywhere}
.ivd .iv-title{text-align:right;flex:none}
.ivd .iv-kind{font:800 30px/1 "Inter","Segoe UI",sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--ac)}
.ivd .iv-no{margin-top:8px;font-weight:600;color:var(--mut);font-size:13px}
.ivd .iv-no b{color:var(--ink)}
.ivd .iv-status{display:inline-block;margin-top:10px;padding:4px 12px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.ivd .iv-status.open{background:#EAF0F7;color:#1E3A5F}
.ivd .iv-status.overdue{background:#FDECEA;color:#B42318}
.ivd .iv-status.paid{background:#E7F5EC;color:#1E7A43}
.ivd .iv-status.void{background:#EEF0F3;color:#5E6878}
.ivd .iv-meta{display:grid;grid-template-columns:repeat(4,1fr);margin:28px 0 0;border:1px solid var(--ln);border-radius:8px;overflow:hidden}
.ivd .iv-meta>div{padding:12px 14px;border-left:1px solid var(--ln)}
.ivd .iv-meta>div:first-child{border-left:0}
.ivd .iv-meta span{display:block;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.ivd .iv-meta b{display:block;font-size:14px;margin-top:3px}
.ivd .iv-meta .hi{background:var(--ac);color:#fff}
.ivd .iv-meta .hi span{color:rgba(255,255,255,.75)}
.ivd .iv-meta .hi b{font-size:18px}
.ivd .iv-parties{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin:26px 0 0}
.ivd h4{margin:0 0 6px;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.ivd .iv-parties b{font-size:14.5px}
.ivd .iv-parties p{margin:0;color:var(--ink);white-space:pre-wrap}
.ivd .iv-parties .m{color:var(--mut);overflow-wrap:anywhere}
.ivd .iv-thanks .c{overflow-wrap:anywhere}
.ivd table.iv-lines{width:100%;border-collapse:collapse;margin:28px 0 0;font-size:13.5px}
.ivd .iv-lines th{background:var(--soft);text-align:left;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);padding:10px 12px;border-top:1px solid var(--ln);border-bottom:1px solid var(--ln)}
.ivd .iv-lines td{padding:12px;border-bottom:1px solid var(--ln);vertical-align:top}
.ivd .iv-lines .n{text-align:right;white-space:nowrap}
.ivd .iv-lines .ix{width:34px;color:var(--mut)}
.ivd .iv-lines td.d{font-weight:600}
.ivd .iv-sum{display:grid;grid-template-columns:1fr 300px;gap:28px;margin:22px 0 0;align-items:start}
.ivd .iv-tot{display:grid}
.ivd .iv-tot div{display:flex;justify-content:space-between;gap:16px;padding:6px 12px}
.ivd .iv-tot span{color:var(--mut)}
.ivd .iv-tot .t{border-top:1px solid var(--ln);margin-top:4px;padding-top:10px;font-weight:700}
.ivd .iv-tot .t span{color:var(--ink)}
.ivd .iv-tot .due{background:var(--ac);color:#fff;border-radius:8px;padding:12px;margin-top:8px;font-size:16px;font-weight:800}
.ivd .iv-tot .due span{color:#fff}
.ivd .iv-box{background:var(--soft);border-radius:8px;padding:14px 16px;margin-bottom:12px}
.ivd .iv-box p{margin:0;white-space:pre-wrap}
.ivd .iv-pay{width:100%;border-collapse:collapse;margin:6px 0 0;font-size:13px}
.ivd .iv-pay td{padding:6px 0;border-bottom:1px solid var(--ln)}
.ivd .iv-pay td.n{text-align:right;font-weight:700}
.ivd .iv-pp{position:relative}
.ivd .iv-pp.stamped p{padding-right:150px}
.ivd .iv-stamp{position:absolute;right:4px;top:6px;transform:rotate(-10deg);border:3px double #1E7A43;color:#1E7A43;border-radius:8px;padding:7px 14px;font:900 22px/1 "Inter","Segoe UI",sans-serif;letter-spacing:.16em;opacity:.8;pointer-events:none;text-align:center}
.ivd .iv-stamp small{display:block;font-size:9px;letter-spacing:.08em;margin-top:4px;font-weight:700}
.ivd .iv-stamp.void{border-color:#B42318;color:#B42318}
.ivd .iv-thanks{margin:30px 0 0;padding:18px 0 0;border-top:1px solid var(--ln);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-end}
.ivd .iv-thanks b{font-size:15px;color:var(--ac)}
.ivd .iv-thanks .c{color:var(--mut);font-size:12px;text-align:right}
.ivd .iv-made{background:var(--soft);color:var(--mut);font-size:11px;text-align:center;padding:9px 12px;border-top:1px solid var(--ln)}
.ivd .iv-made a{color:inherit}
@media (max-width:640px){
  .ivd .iv-in{padding:22px 18px 18px}
  .ivd .iv-head{flex-direction:column-reverse;gap:16px}
  .ivd .iv-title{text-align:left}
  .ivd .iv-from{flex-direction:column;gap:10px}
  .ivd .iv-kind{font-size:24px}
  .ivd .iv-meta{grid-template-columns:1fr 1fr}
  .ivd .iv-meta>div:nth-child(3){border-left:0}
  .ivd .iv-meta>div:nth-child(n+3){border-top:1px solid var(--ln)}
  .ivd .iv-parties,.ivd .iv-sum{grid-template-columns:1fr;gap:18px}
  .ivd .iv-lines .q,.ivd .iv-lines .r,.ivd .iv-lines .ix{display:none}
  .ivd .iv-stamp{font-size:18px}
  .ivd .iv-pp.stamped p{padding-right:120px}
  .ivd .iv-thanks .c{text-align:left}
}
@media print{
  @page{size:letter;margin:12mm}
  .ivd{border:0;border-radius:0;max-width:none}
  .ivd .iv-in{padding:26px 6px 18px}
  .ivd .iv-lines tr{break-inside:avoid}
}
</style>
</head>
<body>
<div class="wrap" id="root"><div class="msg">Loading your invoice…</div></div>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
(function(){
const root=document.getElementById("root");
// Amounts show in the business's currency, written the local way (older invoices: US dollars).
let fmt=new Intl.NumberFormat("en-US",{style:"currency",currency:"USD"});
function setCurrency(p){ try { if (/^[A-Z]{3}$/.test(p.currency||"")) fmt=new Intl.NumberFormat("en-"+(/^[A-Z]{2}$/.test(p.country||"")?p.country:"US"),{style:"currency",currency:p.currency,minimumFractionDigits:2,maximumFractionDigits:2}); } catch(e){} }
const money=n=>{ const v=Number(n)||0; return (v<0?"−":"")+fmt.format(Math.abs(v)); };
const niceDate=s=>{ if(!s) return ""; const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d).toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"}); };
function el(tag,props,...kids){ const n=document.createElement(tag);
  for (const [k,v] of Object.entries(props||{})){ if(v==null||v===false) continue; if(k==="class") n.className=v; else if(k.startsWith("on")) n.addEventListener(k.slice(2),v); else n.setAttribute(k,v); }
  kids.flat().forEach(c=>{ if(c!=null&&c!==false) n.append(c instanceof Node?c:document.createTextNode(String(c))); }); return n; }
function show(msg){ root.replaceChildren(el("div",{class:"msg"},msg)); }
const key=new URLSearchParams(location.search).get("k");
const justPaid=/[?&]paid=1\b/.test(location.search);
const PAY_URL="https://us-central1-stanfill-clean-pros.cloudfunctions.net/stripePayInvoice";
if (!key || !/^[A-Za-z0-9_-]{6,64}$/.test(key)) return show("This invoice link isn't complete. Check the link you were sent, or contact the business.");
let db;
// Same project settings as firebase-config.js (that file also starts sign-in, which this page doesn't need).
const firebaseConfig={apiKey:"AIzaSyDYko5NB-FkjcBpc3fre-3oVbhiF6KKdiw",authDomain:"stanfill-clean-pros.firebaseapp.com",projectId:"stanfill-clean-pros",
  storageBucket:"stanfill-clean-pros.firebasestorage.app",messagingSenderId:"711004999611",appId:"1:711004999611:web:061f428e7d8e679e43be9e"};
try { firebase.initializeApp(firebaseConfig); db=firebase.firestore(); } catch(e){ return show("Couldn't load the invoice. Please try again in a moment."); }
db.doc("publicInvoices/"+key).get().then(snap=>{
  if (!snap.exists) return show("We couldn't find this invoice. It may have been replaced; contact the business for a new link.");
  const p=snap.data(); setCurrency(p); render(p);
  // Back from paying by card: Stripe tells us within a few seconds, so look again until it shows as paid.
  if (justPaid && p.status==="open") [4000,10000,20000].forEach(ms=>setTimeout(()=>db.doc("publicInvoices/"+key).get().then(x=>{ if (x.exists){ const q=x.data(); setCurrency(q); render(q); } }).catch(()=>{}),ms));
  // Let the business know their client opened it (once).
  if (!p.viewedAt && p.status!=="void" && !/[?&]preview\b/.test(location.search)) db.doc("publicInvoices/"+key).update({viewedAt:Date.now()}).catch(()=>{});
}).catch(()=>show("Couldn't load the invoice. Check your connection and try again."));

// One invoice / receipt layout, shared by the client's link page and the app's Print or PDF.
// p = the client's copy of the invoice (publicInvoices). h = {el, money, niceDate, todayYmd}.
function invDocBuild(p,h){
  const {el,money,niceDate}=h, b=p.biz||{}, c=p.client||{};
  const paid=p.status==="paid", voided=p.status==="void";
  const overdue=p.status==="open" && p.dueDate && p.terms!=="Due on receipt" && p.dueDate<h.todayYmd && (p.dueNowBal||0)>0.004;
  const pays=(p.payments||[]).slice().sort((a,b2)=>String(a.date).localeCompare(String(b2.date)));
  const lastPay=pays.length?pays[pays.length-1]:null;
  const kind=voided?"Invoice":paid?"Receipt":p.kind==="deposit"?"Deposit invoice":"Invoice";
  const color=/^#[0-9a-f]{6}$/i.test(p.color||"")?p.color:"#1E3A5F";
  const initials=String(b.name||"?").split(/\s+/).filter(w=>/^[A-Za-z0-9]/.test(w)).slice(0,2).map(w=>w[0].toUpperCase()).join("")||"?";
  const cityLine=[b.city,b.state].filter(Boolean).join(", ");
  const doc=el("div",{class:"ivd",style:"--ac:"+color});
  const inner=el("div",{class:"iv-in"});
  doc.append(el("div",{class:"iv-band"}),inner);
  // header
  inner.append(el("div",{class:"iv-head"},
    el("div",{class:"iv-from"},
      p.logo&&/^data:image\/(png|jpeg|webp);base64,/.test(p.logo)?el("img",{class:"iv-logo",src:p.logo,alt:b.name||""}):el("div",{class:"iv-mono","aria-hidden":"true"},initials),
      el("div",{},el("div",{class:"iv-biz"},b.name||""),
        el("div",{class:"iv-addr"},...[b.address,cityLine,[b.phone,b.email].filter(Boolean).join("  ·  "),b.website].filter(Boolean).flatMap((x,i)=>i?[el("br"),x]:[x])))),
    el("div",{class:"iv-title"},el("div",{class:"iv-kind"},kind),
      el("div",{class:"iv-no"},paid?"For invoice ":"No. ",el("b",{},p.number||"")),
      el("span",{class:"iv-status "+(voided?"void":paid?"paid":overdue?"overdue":"open")},voided?"Void":paid?"Paid in full":overdue?"Overdue":(p.paid?"Partly paid":"Awaiting payment")))));
  // key facts
  const cell=(k,v,hi)=>el("div",{class:hi?"hi":""},el("span",{},k),el("b",{},v));
  inner.append(el("div",{class:"iv-meta"},
    cell("Invoice date",niceDate(p.issueDate)),
    paid?cell("Paid on",lastPay?niceDate(lastPay.date):"—"):cell("Due date",p.terms==="Due on receipt"?"On receipt":niceDate(p.dueDate)),
    paid?cell("Paid by",lastPay?(pays.length>1?pays.length+" payments":lastPay.method||"—"):"—"):cell("Terms",p.terms||"—"),
    voided?cell("Status","Cancelled",true):paid?cell("Amount paid",money(p.total-(p.credit||0)),true):cell("Amount due",money(p.dueNowBal),true)));
  // parties
  inner.append(el("div",{class:"iv-parties"},
    el("div",{},el("h4",{},paid?"Received from":"Billed to"),el("b",{},c.name||""),
      c.address?el("p",{},c.address):null,[c.email,c.phone].filter(Boolean).length?el("p",{class:"m"},[c.email,c.phone].filter(Boolean).join("  ·  ")):null),
    el("div",{class:"iv-pp"+(paid||voided?" stamped":"")},el("h4",{},paid||voided?"Payment":"How to pay"),
      paid||voided?el("div",{class:"iv-stamp"+(voided?" void":"")},voided?"VOID":"PAID",paid&&lastPay?el("small",{},niceDate(lastPay.date)):null):null,
      paid?el("p",{},"Paid in full"+(lastPay?" on "+niceDate(lastPay.date)+(lastPay.method?" by "+(/^(cash|check|card|credit card|debit card|bank transfer|other)$/i.test(lastPay.method)?lastPay.method.toLowerCase():lastPay.method):""):"")+". Thank you!")
        :voided?el("p",{},"This invoice was cancelled. Nothing is owed on it.")
        :el("p",{},p.payNote||("Please pay by "+(p.terms==="Due on receipt"?"the date of service":niceDate(p.dueDate))+". Contact us with any questions.")))));
  // line items
  const tb=el("tbody");
  (p.lines||[]).forEach((l,i)=>tb.append(el("tr",{},el("td",{class:"ix"},String(i+1).padStart(2,"0")),el("td",{class:"d"},l.desc||""),
    el("td",{class:"n q"},String(l.qty)),el("td",{class:"n r"},money(l.unitPrice)),el("td",{class:"n"},money(l.amount)))));
  inner.append(el("table",{class:"iv-lines"},el("thead",{},el("tr",{},el("th",{class:"ix"},"#"),el("th",{},"Description"),el("th",{class:"n q"},"Qty"),el("th",{class:"n r"},"Rate"),el("th",{class:"n"},"Amount"))),tb));
  // notes + totals
  const T=el("div",{class:"iv-tot"}); const L=(a,v,cl)=>T.append(el("div",{class:cl||""},el("span",{},a),el("b",{},v)));
  L("Subtotal",money(p.subtotal)); if (p.discount) L("Discount","−"+money(p.discount));
  if (p.tax) L((p.taxName||"Sales tax")+" ("+p.taxRate+"%"+(p.taxBase!=null&&Math.abs((p.subtotal-(p.discount||0))-p.taxBase)>0.004?" on "+money(p.taxBase):"")+")",money(p.tax));
  L("Total",money(p.total),"t"); if (p.credit) L("Less deposit received","−"+money(p.credit)); if (p.held) L("Retainage held ("+p.retainagePct+"%)","−"+money(p.held));
  if (p.paid) L("Payments received","−"+money(p.paid));
  L(voided?"Amount due":paid?"Balance due":"Amount due",money(paid||voided?0:p.dueNowBal),"due");
  const left=el("div",{});
  if (pays.length) left.append(el("div",{class:"iv-box"},el("h4",{},"Payment history"),el("table",{class:"iv-pay"},el("tbody",{},
    ...pays.map(x=>el("tr",{},el("td",{},niceDate(x.date)),el("td",{},x.method||""),el("td",{class:"n"},money(x.amount))))))));
  if (p.notes) left.append(el("div",{class:"iv-box"},el("h4",{},"Notes"),el("p",{},p.notes)));
  inner.append(el("div",{class:"iv-sum"},left,T));
  inner.append(el("div",{class:"iv-thanks"},el("b",{},p.footer||"Thank you for your business!"),
    el("div",{class:"c"},"Questions? "+([b.phone,b.email].filter(Boolean).join(" or ")||"Contact "+(b.name||"us")))));
  doc.append(el("div",{class:"iv-made"},"Sent with DayZift · A product of ",el("a",{href:"https://www.litamerica.net",target:"_blank",rel:"noopener"},"LIT America")));
  return doc;
}

function render(p){
  document.title=(p.status==="paid"?"Receipt ":p.kind==="deposit"?"Deposit invoice ":"Invoice ")+(p.number||"")+" · "+(p.biz&&p.biz.name||"");
  const open=p.status==="open", amt=p.dueNowBal, b=p.biz||{};
  const color=/^#[0-9a-f]{6}$/i.test(p.color||"")?p.color:"#1E3A5F";
  const bar=el("div",{class:"bar",style:"--ac:"+color},
    el("div",{class:"due"},p.status==="paid"?["Paid in full. ",el("b",{},"Thank you!")]:p.status==="void"?"This invoice was cancelled.":["Amount due ",el("b",{},money(amt)),p.dueDate&&p.terms!=="Due on receipt"?" by "+niceDate(p.dueDate):""]),
    el("div",{class:"btns"},
      open&&amt>0&&p.cardPay&&!justPaid?el("a",{class:"btn pay",href:PAY_URL+"?k="+encodeURIComponent(key),rel:"nofollow"},"Pay by card"):null,
      open&&amt>0&&p.payLink&&/^https:\/\//i.test(p.payLink)?el("a",{class:p.cardPay?"btn":"btn pay",href:p.payLink,rel:"noopener nofollow"},p.cardPay?"Other ways to pay":"Pay online"):null,
      el("button",{class:"btn",onclick:()=>window.print()},p.status==="paid"?"Print or save receipt":"Print or save PDF")));
  const t=new Date(), todayYmd=t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0");
  const thanks=justPaid?el("div",{class:"bar noprint",style:"background:#E8F5EE;border-color:#B7DEC6"},el("div",{},el("b",{},"Thank you! Your card payment went through."),
    p.status==="paid"?" This invoice is now paid.":" It can take a minute to show on the invoice. Your card receipt comes from Stripe by email.")):null;
  root.replaceChildren(...[thanks,bar].filter(Boolean),invDocBuild(p,{el,money,niceDate,todayYmd}),
    el("p",{class:"help noprint"},"Questions about this "+(p.status==="paid"?"receipt":"invoice")+"? Contact "+(b.name||"the business")+(b.phone?" at "+b.phone:"")+(b.email?" or "+b.email:"")+"."));
}
})();
</script>
</body>
</html>
