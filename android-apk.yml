# Builds the Dayshift Android app (APK) from the web app on every push to main,
# and publishes it as the "latest" release so the phone can download it from:
#   https://github.com/<owner>/<repo>/releases/latest/download/Dayshift.apk
# A product of LIT America — www.litamerica.net
name: Build Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor
        run: npm install

      - name: Copy web app into www/
        run: npm run build:web

      - name: Create Android project
        run: npx cap add android

      - name: App icon and splash screen
        continue-on-error: true
        run: npx capacitor-assets generate --android --iconBackgroundColor '#1F7A69' --splashBackgroundColor '#1F7A69'

      - name: Location permissions and version number
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#&\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-feature android:name="android.hardware.location.gps" android:required="false" />#' "$MANIFEST"
          grep -n "permission" "$MANIFEST"
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]+\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n -E "versionCode|versionName" android/app/build.gradle

      - name: Sync web app into Android project
        run: npx cap sync android

      - name: Build APK
        run: |
          # Same signing key every build, so new versions install over old ones.
          mkdir -p ~/.android
          cp android-keystore/dayshift-debug.keystore ~/.android/debug.keystore
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Dayshift.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Dayshift-apk
          path: Dayshift.apk

      - name: Publish as latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --cleanup-tag -y || true
          gh release create android-latest Dayshift.apk \
            --title "Dayshift Android app (build ${{ github.run_number }})" \
            --notes "Install on your phone: open this page on the phone and tap Dayshift.apk. A product of LIT America — https://www.litamerica.net" \
            --latest
