<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rightway Invoices</title>
<meta name="description" content="Counter invoicing for Rightway Auto Recycling: parts, cores, returns and today's sales.">
<meta name="robots" content="noindex">
<style>
:root{
  --bg:#F3F4F1; --paper:#FFFFFF; --ink:#1B2420; --muted:#5E6A64; --line:#DCE0DA;
  --brand:#1F5A3E; --brand-soft:#E5F0EA; --core:#8A5A00; --core-soft:#FFF3D6;
  --good:#1E6B45; --good-soft:#E3F3E9; --bad:#A3271B; --bad-soft:#FBE7E4;
  --r:14px; --shadow:0 1px 2px rgba(20,30,25,.06),0 4px 14px rgba(20,30,25,.05);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
header{background:var(--ink);color:#fff}
.hwrap{max-width:1180px;margin:0 auto;padding:14px 20px 0;display:flex;flex-direction:column;gap:12px}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand b{font-size:22px;letter-spacing:.02em}
.brand span{opacity:.75;font-size:15px}
#tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tab{border:0;background:transparent;color:#C9D2CD;padding:12px 18px;border-radius:12px 12px 0 0;font-weight:600;font-size:17px;cursor:pointer;white-space:nowrap}
.tab:hover{color:#fff}
.tab.on{background:var(--bg);color:var(--ink)}
main{max-width:1180px;margin:0 auto;padding:20px}
h2{font-size:24px;margin:0 0 12px}
h3{font-size:19px;margin:0 0 10px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1}
.panel,.paper{background:var(--paper);border-radius:var(--r);box-shadow:var(--shadow);padding:20px;margin:0 0 16px}
.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 20px;font-weight:600;cursor:pointer;min-height:48px}
.btn:hover{border-color:#B9C2BC}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:#174A32}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.big{font-size:19px;padding:14px 28px}
.btn.small{min-height:38px;padding:7px 14px;font-size:15px}
.acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}
.acts.left{justify-content:flex-start;margin:0 0 14px}
input{border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:#fff;min-height:48px;width:100%}
input:focus{outline:3px solid #BFDCCB;border-color:var(--brand)}
.f{display:flex;flex-direction:column;gap:5px;font-size:14px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.f input{text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink);font-size:17px}
.note{background:var(--brand-soft);border-radius:12px;padding:12px 14px;margin:12px 0;font-size:16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.note.good{background:var(--good-soft)}
.empty{color:var(--muted);padding:18px 4px}
.search{font-size:19px;min-height:56px;margin:0 0 14px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:12px;opacity:0;transition:.2s;pointer-events:none;z-index:50;font-weight:600}
#toast.on{opacity:1;transform:translateX(-50%)}

/* New sale: the paper invoice */
.ptop{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:14px}
.biz{display:flex;flex-direction:column}
.biz b{font-size:20px}
.biz span{color:var(--muted);font-size:15px}
.invno{text-align:right;display:flex;flex-direction:column}
.invno .lbl{font-weight:800;font-size:22px;letter-spacing:.04em}
.invno b{font-size:18px}
.invno span:last-child{color:var(--muted);font-size:15px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
.lines{margin-top:18px;border:1px solid var(--line);border-radius:12px;overflow:visible}
.lrow{display:grid;grid-template-columns:minmax(0,1fr) 150px 110px 80px 110px 44px;gap:8px;align-items:center;padding:8px 10px;border-top:1px solid var(--line)}
.lrow:first-child{border-top:0}
.lhead{background:#F7F8F5;font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;border-radius:12px 12px 0 0}
.lrow input{min-height:44px}
.c-amt{text-align:right;font-weight:600}
.lhead .c-amt{font-weight:700}
.c-desc{position:relative;min-width:0}
.c-desc small{display:block;font-size:13px;margin-top:3px}
.c-desc small.warn{color:var(--core)}
.newrow{grid-template-columns:1fr;background:#FBFCFA;border-radius:0 0 12px 12px}
.newrow input{border-style:dashed;font-size:18px}
.x{border:0;background:transparent;font-size:26px;line-height:1;color:var(--muted);cursor:pointer;width:40px;height:40px;border-radius:10px}
.x:hover{background:var(--bad-soft);color:var(--bad)}
.core{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:0 10px;min-height:44px;cursor:pointer;font-size:15px;font-weight:600;color:var(--muted);user-select:none}
.core input{width:22px;height:22px;min-height:0;margin:0;accent-color:var(--core)}
.core.on{background:var(--core-soft);border-color:#E9C877;color:var(--core)}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 4px);background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(20,30,25,.16);z-index:20;padding:6px;max-height:420px;overflow:auto}
.opt{display:flex;justify-content:space-between;gap:12px;width:100%;border:0;background:transparent;text-align:left;padding:11px 12px;border-radius:9px;cursor:pointer;font-size:17px}
.opt.on,.opt:hover{background:var(--brand-soft)}
.opt .pp{font-weight:600;white-space:nowrap}
.opt em{font-style:normal;color:var(--core);font-size:14px;margin-left:8px}
.opt.add{color:var(--brand);font-weight:600;border-top:1px solid var(--line);border-radius:0 0 9px 9px}
.bottom{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;margin-top:18px;align-items:start}
.lbl2{font-size:14px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin-bottom:6px}
.pays{display:flex;gap:8px;flex-wrap:wrap}
.pay{border:2px solid var(--line);background:#fff;border-radius:12px;padding:12px 20px;font-weight:600;cursor:pointer;min-height:52px}
.pay.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}
.chk{max-width:220px;margin-top:10px}
.totals{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.trow{display:flex;justify-content:space-between;padding:10px 14px;border-top:1px solid var(--line)}
.trow:first-child{border-top:0}
.trow.corecharge{color:var(--core)}
.trow.good{color:var(--good)}
.trow.big{font-size:22px;background:#F7F8F5}

/* lists */
.ilist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.irow{display:grid;grid-template-columns:80px minmax(0,1fr) auto 110px;gap:12px;align-items:center;border:0;border-top:1px solid var(--line);background:#fff;padding:14px;text-align:left;cursor:pointer;width:100%}
.irow:first-child{border-top:0}
.irow:hover{background:#F7F8F5}
.ino{font-weight:700;color:var(--brand)}
.iwho{display:flex;flex-direction:column;min-width:0}
.iwho small{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.irow>b{text-align:right}
.itags{display:flex;gap:6px}
.tag{font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;background:#EEF0EC;color:var(--muted);white-space:nowrap}
.tag.warn{background:var(--core-soft);color:var(--core)}
.tag.good{background:var(--good-soft);color:var(--good)}
.tag.bad{background:var(--bad-soft);color:var(--bad);white-space:normal}
.crow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.crow:first-of-type{border-top:0}
.corepanel{border-left:5px solid #E9C877}
.rlist{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.rrow{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer}
.rrow input{width:24px;height:24px;min-height:0;accent-color:var(--brand)}
.rrow.off{opacity:.75;cursor:default;background:#FAFAF8}
.rname{display:flex;flex-direction:column}
.rname small{color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:12px 0 16px}
.stats.three{grid-template-columns:repeat(4,minmax(0,1fr))}
.stat{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column}
.stat b{font-size:26px}
.stat span{color:var(--muted);font-size:15px}
input[type=date]{width:auto}
.plist{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:12px}
.prow{display:grid;grid-template-columns:minmax(0,1fr) 120px 120px;gap:10px;align-items:center;padding:6px 12px;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.prow input{min-height:40px;padding:6px 10px}
.phead{background:#F7F8F5;font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;padding:10px 12px}
.addpart{display:grid;grid-template-columns:minmax(0,1fr) 120px 120px auto;gap:10px}
.dlg{border:0;border-radius:18px;padding:24px;max-width:460px;width:calc(100% - 32px);box-shadow:0 20px 60px rgba(0,0,0,.25)}
.dlg::backdrop{background:rgba(20,30,25,.45)}
.dlg p{font-size:18px}

/* the printed invoice, also shown on screen */
.sheet{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:28px;overflow-x:auto}
.receipt{color:#111;font-size:14px;min-width:640px}
.rhead{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;margin-bottom:12px}
.rlogo{border:2px solid #111;border-radius:6px;padding:4px 10px;text-align:center}
.rlogo .rw{font-weight:800;letter-spacing:.35em;font-size:13px}
.rlogo .ar{font-size:11px;letter-spacing:.08em}
.rbiz b{font-size:17px}
.rtitle{text-align:right}
.rtitle b{font-size:24px;letter-spacing:.05em}
.rgrid{display:grid;grid-template-columns:1fr 1fr;border:1.5px solid #111;border-radius:6px}
.rgrid>div{padding:6px 10px;border-top:1px solid #111;min-height:44px}
.rgrid>div:nth-child(-n+2){border-top:0}
.rgrid>div:nth-child(odd){border-right:1px solid #111}
.rl{display:block;font-size:10px;font-weight:700;letter-spacing:.05em}
.rpay{grid-column:1/-1;display:flex;gap:28px;align-items:center;border-right:0!important}
.pbox{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700}
.pbox i{display:inline-grid;place-items:center;width:16px;height:16px;border:1.5px solid #111;font-style:normal;font-size:13px}
.rtable{width:100%;border-collapse:collapse;margin-top:10px;border:1.5px solid #111}
.rtable th{font-size:11px;letter-spacing:.05em;border-bottom:1.5px solid #111;padding:6px;text-align:left}
.rtable th:not(:first-child),.rtable td:not(:first-child){text-align:right;width:90px;border-left:1px solid #111}
.rtable td{padding:6px;border-top:1px solid #bbb;height:28px}
.rtable .coreline td{font-style:italic}
.rfoot{display:grid;grid-template-columns:1fr 240px;gap:18px;margin-top:10px}
.rnote p{margin:0 0 8px;font-size:12px}
.rafter{font-size:12px;border-left:3px solid #111;padding-left:8px;margin-bottom:8px}
.sig{display:flex;align-items:flex-end;gap:8px;margin-top:22px;font-weight:700;font-size:13px}
.sig span{flex:1;border-bottom:1px solid #111;height:18px}
.rtot{width:100%;border-collapse:collapse;border:1.5px solid #111}
.rtot th{font-size:12px;text-align:right;padding:6px 8px;border-bottom:1px solid #111;border-right:1px solid #111;width:50%}
.rtot td{text-align:right;padding:6px 8px;border-bottom:1px solid #111}
.rtot tr.big th,.rtot tr.big td{font-size:16px;font-weight:800;border-bottom:0}
.slip .big{font-size:16px}
.invpage .sheet{margin-top:4px}
#print{display:none}
footer{text-align:center;color:var(--muted);font-size:14px;padding:24px 16px 40px}
footer a{color:var(--brand);font-weight:600}

@media (max-width:820px){
  body{font-size:16px}
  main{padding:14px}
  .grid2{grid-template-columns:1fr}
  .lrow{grid-template-columns:minmax(0,1fr) 92px 64px 40px;grid-template-areas:"d d d x" "c p q a"}
  .lrow .c-desc{grid-area:d}.lrow .c-core{grid-area:c;grid-column:1/2}.lrow .c-price{grid-area:p}.lrow .c-qty{grid-area:q}.lrow .c-amt{grid-column:2/4;grid-row:3;text-align:left}.lrow .c-x{grid-area:x}
  .lhead{display:none}
  .lrow.newrow{grid-template-columns:1fr;grid-template-areas:none}
  .newrow .c-desc{grid-area:auto}
  .bottom{grid-template-columns:1fr}
  .irow{grid-template-columns:64px minmax(0,1fr) 90px}
  .itags{display:none}
  .stats,.stats.three{grid-template-columns:repeat(2,minmax(0,1fr))}
  .addpart{grid-template-columns:1fr 1fr}
  .prow{grid-template-columns:minmax(0,1fr) 84px 84px}
  .ptop{flex-direction:column}
  .invno{text-align:left}
}
@media print{
  @page{size:letter;margin:.4in}
  body{background:#fff}
  header,main,footer,#toast,dialog{display:none!important}
  #print{display:block}
  .receipt{min-width:0;font-size:12.5px}
}
</style>
</head>
<body>
<header><div class="hwrap">
  <div class="brand"><b>RIGHTWAY</b><span>Auto Recycling · Decaturville, TN · 731-549-3179</span></div>
  <nav id="tabs" aria-label="Sections"></nav>
</div></header>
<main id="view"></main>
<div id="print"></div>
<div id="toast" role="status" aria-live="polite"></div>
<footer>Demo · saved on this computer only · <a href="#" id="reset">Reset demo</a><br>Rightway Invoices · A product of <a href="https://www.litamerica.net" target="_blank" rel="noopener">LIT America</a></footer>
<script src="prices.js"></script>
<script src="app.js"></script>
</body>
</html>
